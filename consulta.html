<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consulta de Treinamento — Motoristas</title>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      color: #0e1b3d;
      min-height: 100vh;
      padding: 24px;
    }
    .box {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      border: 1px solid rgba(14,27,61,.12);
    }
    h1 { font-size: 22px; margin-bottom: 8px; text-transform: uppercase; }
    h2 { font-size: 22px; margin-bottom: 18px; }
    p { color: #3a4a70; margin-bottom: 18px; line-height: 1.5; }
    hr { border: 0; border-top: 1px solid rgba(14,27,61,.14); margin: 30px 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #3a4a70;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid rgba(14,27,61,.2);
      margin-bottom: 12px;
      background: #fff;
      color: #0e1b3d;
    }
    .datas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      background: #1e50c8;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .resultado {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(14,27,61,.14);
      display: none;
    }
    .ok { background: rgba(13,107,58,.10); color: #0d6b3a; border-color: rgba(13,107,58,.25); }
    .bad { background: rgba(181,43,43,.09); color: #b52b2b; border-color: rgba(181,43,43,.25); }
    .warn { background: rgba(184,114,16,.10); color: #b87210; border-color: rgba(184,114,16,.25); }
    .linha { margin-top: 8px; font-size: 14px; }
    .linha strong { display: inline-block; min-width: 150px; color: #0e1b3d; }
    .top-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #1e50c8;
      text-decoration: none;
      font-weight: bold;
    }
    .top-link:hover { text-decoration: underline; }
    .resumo-relatorio {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #f5f7fc;
      border: 1px solid rgba(14,27,61,.14);
    }
    .resumo-relatorio strong { font-size: 18px; }
    .periodo-texto { margin-top: 8px; margin-bottom: 0; font-size: 14px; }
    #areaPdf { display: none; margin-top: 15px; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .box { padding: 18px; }
      .datas { grid-template-columns: 1fr; gap: 0; }
      .acoes button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="box">
    <a class="top-link" href="./index.html">← Voltar para treinamento</a>

    <h1>Consulta de Treinamento</h1>
    <p>Digite o CPF do motorista para verificar se o treinamento está válido ou vencido.</p>

    <label for="cpfConsulta">CPF do motorista</label>
    <input id="cpfConsulta" type="text" placeholder="Somente números" inputmode="numeric" />
    <button id="btnConsultar" type="button">Consultar</button>
    <div id="resultado" class="resultado"></div>

    <hr>

    <h2>Relatórios</h2>
    <div class="datas">
      <div>
        <label for="dataInicial">Data inicial</label>
        <input type="date" id="dataInicial">
      </div>
      <div>
        <label for="dataFinal">Data final</label>
        <input type="date" id="dataFinal">
      </div>
    </div>

    <div class="acoes">
      <button id="btnRelatorio" type="button">Gerar relatório</button>
    </div>

    <div id="resumoRelatorio" class="resumo-relatorio">
      <strong id="totalRelatorio">Total de treinamentos encontrados: 0</strong>
      <p id="periodoRelatorio" class="periodo-texto"></p>
    </div>

    <div id="areaPdf">
      <button id="btnPdf" type="button">Exportar PDF</button>
    </div>
  </div>

<script>
const API_CONSULTA = "https://api-motoristas.vercel.app/api/consultar-treinamento";
const API_RELATORIO = "https://api-motoristas.vercel.app/api/relatorio-completo";

const cpfInput = document.getElementById("cpfConsulta");
const btnConsultar = document.getElementById("btnConsultar");
const resultado = document.getElementById("resultado");
const dataInicial = document.getElementById("dataInicial");
const dataFinal = document.getElementById("dataFinal");
const btnRelatorio = document.getElementById("btnRelatorio");
const resumoRelatorio = document.getElementById("resumoRelatorio");
const totalRelatorio = document.getElementById("totalRelatorio");
const periodoRelatorio = document.getElementById("periodoRelatorio");
const areaPdf = document.getElementById("areaPdf");
const btnPdf = document.getElementById("btnPdf");

let dadosRelatorio = [];
let periodoAtual = { inicio: "", fim: "" };

function somenteNumeros(valor) {
  return String(valor || "").replace(/\D/g, "").slice(0, 11);
}

function escapar(valor) {
  return String(valor ?? "-")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatarData(dataIso) {
  if (!dataIso) return "-";
  const data = new Date(dataIso);
  if (Number.isNaN(data.getTime())) return "-";
  return data.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
}

function formatarDataInput(valor) {
  if (!valor) return "-";
  const [ano, mes, dia] = valor.split("-");
  return `${dia}/${mes}/${ano}`;
}

function mostrar(tipo, html) {
  resultado.className = "resultado " + tipo;
  resultado.innerHTML = html;
  resultado.style.display = "block";
}

function statusAtual(registro) {
  const validade = new Date(registro.validadeAte);
  return !Number.isNaN(validade.getTime()) && new Date() > validade ? "VENCIDO" : "VALIDO";
}

cpfInput.addEventListener("input", () => {
  cpfInput.value = somenteNumeros(cpfInput.value);
});

btnConsultar.addEventListener("click", async () => {
  const cpf = somenteNumeros(cpfInput.value);
  if (cpf.length !== 11) {
    mostrar("warn", "<strong>CPF inválido.</strong><br>Digite os 11 números do CPF.");
    return;
  }

  mostrar("warn", "Consultando...");
  try {
    const resp = await fetch(API_CONSULTA + "?cpf=" + encodeURIComponent(cpf));
    const json = await resp.json();

    if (!resp.ok || !json.ok) {
      mostrar("bad", `
        <strong>Treinamento não encontrado.</strong>
        <div class="linha">O motorista deve realizar a integração.</div>
      `);
      return;
    }

    const r = json.registro;
    const valido = json.status === "VALIDO";
    mostrar(valido ? "ok" : "bad", `
      <strong>${valido ? "Treinamento válido." : "Treinamento vencido."}</strong>
      ${valido ? "" : '<div class="linha">O motorista deve realizar uma nova integração.</div>'}
      <div class="linha"><strong>Nome:</strong> ${escapar(r.nome)}</div>
      <div class="linha"><strong>CPF:</strong> ${escapar(r.cpf)}</div>
      <div class="linha"><strong>Empresa:</strong> ${escapar(r.empresa)}</div>
      <div class="linha"><strong>Placa:</strong> ${escapar(r.placa)}</div>
      <div class="linha"><strong>${valido ? "Treinamento:" : "Último treinamento:"}</strong> ${formatarData(r.dataTreinamento)}</div>
      <div class="linha"><strong>${valido ? "Válido até:" : "Venceu em:"}</strong> ${formatarData(r.validadeAte)}</div>
      <div class="linha"><strong>Protocolo:</strong> ${escapar(r.protocolo)}</div>
    `);
  } catch (err) {
    console.error(err);
    mostrar("bad", "Erro ao consultar treinamento. Tente novamente.");
  }
});

btnRelatorio.addEventListener("click", async () => {
  const inicio = dataInicial.value;
  const fim = dataFinal.value;

  resumoRelatorio.style.display = "none";
  areaPdf.style.display = "none";
  dadosRelatorio = [];

  if (!inicio || !fim) {
    resumoRelatorio.style.display = "block";
    totalRelatorio.textContent = "Informe a data inicial e a data final.";
    periodoRelatorio.textContent = "";
    return;
  }

  if (inicio > fim) {
    resumoRelatorio.style.display = "block";
    totalRelatorio.textContent = "A data inicial não pode ser maior que a data final.";
    periodoRelatorio.textContent = "";
    return;
  }

  btnRelatorio.disabled = true;
  btnRelatorio.textContent = "Gerando...";

  try {
    const resp = await fetch(API_RELATORIO);
    const json = await resp.json();
    if (!resp.ok || !json.ok) throw new Error(json.erro || "Falha ao carregar registros.");

    dadosRelatorio = (json.registros || []).filter(r => {
      const data = String(r.dataTreinamento || "").substring(0, 10);
      return data >= inicio && data <= fim;
    });

    dadosRelatorio.sort((a, b) => new Date(a.dataTreinamento) - new Date(b.dataTreinamento));
    periodoAtual = { inicio, fim };

    totalRelatorio.textContent = `Total de treinamentos encontrados: ${dadosRelatorio.length}`;
    periodoRelatorio.textContent = `Período selecionado: ${formatarDataInput(inicio)} a ${formatarDataInput(fim)}`;
    resumoRelatorio.style.display = "block";
    areaPdf.style.display = dadosRelatorio.length ? "block" : "none";
  } catch (err) {
    console.error(err);
    totalRelatorio.textContent = "Erro ao gerar relatório.";
    periodoRelatorio.textContent = err.message || "Tente novamente.";
    resumoRelatorio.style.display = "block";
  } finally {
    btnRelatorio.disabled = false;
    btnRelatorio.textContent = "Gerar relatório";
  }
});

btnPdf.addEventListener("click", () => {
  if (!dadosRelatorio.length) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("Não foi possível carregar o gerador de PDF.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const geradoEm = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
  const validos = dadosRelatorio.filter(r => statusAtual(r) === "VALIDO").length;
  const vencidos = dadosRelatorio.length - validos;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.text("RELATÓRIO DE TREINAMENTOS DE MOTORISTAS", 14, 15);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(`Período: ${formatarDataInput(periodoAtual.inicio)} a ${formatarDataInput(periodoAtual.fim)}`, 14, 23);
  doc.text(`Total: ${dadosRelatorio.length} | Válidos: ${validos} | Vencidos: ${vencidos}`, 14, 29);
  doc.text(`Gerado em: ${geradoEm}`, 14, 35);

  const linhas = dadosRelatorio.map((r, index) => [
    index + 1,
    r.nome || "-",
    r.cpf || "-",
    r.empresa || "-",
    r.placa || "-",
    formatarData(r.dataTreinamento),
    formatarData(r.validadeAte),
    statusAtual(r)
  ]);

  doc.autoTable({
    startY: 41,
    head: [["#", "Nome", "CPF", "Empresa", "Placa", "Treinamento", "Validade", "Status"]],
    body: linhas,
    theme: "grid",
    styles: { font: "helvetica", fontSize: 7.5, cellPadding: 2, overflow: "linebreak" },
    headStyles: { fillColor: [30, 80, 200], textColor: 255, fontStyle: "bold" },
    alternateRowStyles: { fillColor: [242, 245, 251] },
    columnStyles: {
      0: { cellWidth: 9 },
      1: { cellWidth: 52 },
      2: { cellWidth: 28 },
      3: { cellWidth: 55 },
      4: { cellWidth: 22 },
      5: { cellWidth: 27 },
      6: { cellWidth: 27 },
      7: { cellWidth: 22 }
    },
    margin: { left: 14, right: 14 },
    didDrawPage: function(data) {
      const pagina = doc.internal.getNumberOfPages();
      doc.setFontSize(8);
      doc.setTextColor(100);
      doc.text(`Página ${pagina}`, 283, 202, { align: "right" });
    }
  });

  const nomeArquivo = `relatorio-treinamentos-${periodoAtual.inicio}-a-${periodoAtual.fim}.pdf`;
  doc.save(nomeArquivo);
});
</script>
</body>
</html>
