<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consulta de Treinamento — Motoristas</title>
  

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      color: #0e1b3d;
      min-height: 100vh;
      padding: 24px;
    }

    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      border: 1px solid rgba(14,27,61,.12);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    p {
      color: #3a4a70;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #3a4a70;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid rgba(14,27,61,.2);
      margin-bottom: 12px;
    }

    button {
      background: #1E50C8;
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:hover {
      background: #2563eb;
    }

    .resultado {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(14,27,61,.14);
      display: none;
    }

    .ok {
      background: rgba(13,107,58,.10);
      color: #0D6B3A;
      border-color: rgba(13,107,58,.25);
    }

    .bad {
      background: rgba(181,43,43,.09);
      color: #B52B2B;
      border-color: rgba(181,43,43,.25);
    }

    .warn {
      background: rgba(184,114,16,.10);
      color: #B87210;
      border-color: rgba(184,114,16,.25);
    }

    .linha {
      margin-top: 8px;
      font-size: 14px;
    }

    .linha strong {
      display: inline-block;
      min-width: 150px;
      color: #0e1b3d;
    }

    .top-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #1E50C8;
      text-decoration: none;
      font-weight: bold;
    }

    .top-link:hover {
      text-decoration: underline;
    }
  
    .login-box{max-width:430px;margin:7vh auto 0;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08);border:1px solid rgba(14,27,61,.12)}
    .login-erro{display:none;margin-top:14px;padding:12px;border-radius:12px;background:rgba(181,43,43,.09);color:#b52b2b}
    .topo-admin{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.btn-sair{background:#5f6b85;padding:9px 14px}
  </style>
</head>
<body>
  <div id="loginArea" class="login-box">
    <h1>Acesso restrito</h1><p>Informe o usuário e a senha para acessar consultas e relatórios.</p>
    <label for="loginUsuario">Usuário</label><input id="loginUsuario" type="text" placeholder="Digite o usuário" autocomplete="username">
    <label for="loginSenha">Senha</label><input id="loginSenha" type="password" placeholder="Digite a senha" autocomplete="current-password">
    <button id="btnEntrar" type="button">Entrar</button><div id="loginErro" class="login-erro"></div>
  </div>
  <div id="appArea" class="box" style="display:none;">
    <div class="topo-admin"><a class="top-link" href="./index.html" style="margin:0">← Voltar para treinamento</a><button id="btnSair" class="btn-sair" type="button">Sair</button></div>

    <h1>Consulta de Treinamento</h1>
    <p>
      Digite o CPF do motorista para verificar se o treinamento está válido ou vencido.
    </p>

    <label for="cpfConsulta">CPF do motorista</label>
    <input id="cpfConsulta" type="text" placeholder="Somente números" inputmode="numeric" />

    <button id="btnConsultar">Consultar</button>

    <div id="resultado" class="resultado"></div>
    <hr style="margin:30px 0;">

<h2>Relatórios</h2>

<div style="margin-top:15px;">

  <label>Data Inicial</label>
  <input type="date" id="dataInicial">

  <label>Data Final</label>
  <input type="date" id="dataFinal">

  <button id="btnRelatorio">
    Gerar Relatório
  </button>
  <button id="btnPdf">
Exportar PDF
</button>

</div>

<div id="totais" style="margin-top:20px;"></div>

<div id="resultadoRelatorio"
     style="margin-top:20px;overflow:auto;">
</div>
  </div>

<script>
const API_CONSULTA = "https://api-motoristas.vercel.app/api/consultar-treinamento";

const loginArea=document.getElementById("loginArea"),appArea=document.getElementById("appArea"),loginUsuario=document.getElementById("loginUsuario"),loginSenha=document.getElementById("loginSenha"),btnEntrar=document.getElementById("btnEntrar"),btnSair=document.getElementById("btnSair"),loginErro=document.getElementById("loginErro");
const USUARIO_ADMIN="admin";
const SENHA_ADMIN="bomretiro@123";
function mostrarApp(){loginArea.style.display="none";appArea.style.display="block";sessionStorage.setItem("consulta_autenticada","sim");}
function mostrarLogin(msg=""){sessionStorage.removeItem("consulta_autenticada");appArea.style.display="none";loginArea.style.display="block";loginErro.style.display=msg?"block":"none";loginErro.textContent=msg;loginSenha.value="";}
function entrar(){if(loginUsuario.value.trim()===USUARIO_ADMIN&&loginSenha.value===SENHA_ADMIN)mostrarApp();else mostrarLogin("Usuário ou senha inválidos.");}
btnEntrar.addEventListener("click",entrar);loginSenha.addEventListener("keydown",e=>{if(e.key==="Enter")entrar();});btnSair.addEventListener("click",()=>mostrarLogin());
if(sessionStorage.getItem("consulta_autenticada")==="sim")mostrarApp();else mostrarLogin();

const cpfInput = document.getElementById("cpfConsulta");
const btnConsultar = document.getElementById("btnConsultar");
const resultado = document.getElementById("resultado");
const API_RELATORIO =
"https://api-motoristas.vercel.app/api/relatorio-completo";

let dadosRelatorio = [];


function somenteNumeros(valor) {
  return String(valor || "").replace(/\D/g, "").slice(0, 11);
}

function formatarData(dataIso) {
  if (!dataIso) return "-";

  const data = new Date(dataIso);

  return data.toLocaleDateString("pt-BR", {
    timeZone: "America/Sao_Paulo"
  });
}

function mostrar(tipo, html) {
  resultado.className = "resultado " + tipo;
  resultado.innerHTML = html;
  resultado.style.display = "block";
}

cpfInput.addEventListener("input", () => {
  cpfInput.value = somenteNumeros(cpfInput.value);
});

btnConsultar.addEventListener("click", async () => {
  const cpf = somenteNumeros(cpfInput.value);

  if (cpf.length !== 11) {
    mostrar("warn", "<strong>CPF inválido.</strong><br>Digite os 11 números do CPF.");
    return;
  }

  mostrar("warn", "Consultando...");

  try {
    const resp = await fetch(API_CONSULTA + "?cpf=" + encodeURIComponent(cpf));
    const json = await resp.json();

    if (!resp.ok || !json.ok) {
      mostrar("bad", `
        <strong>Treinamento não encontrado.</strong>
        <div class="linha">O motorista deve realizar a integração.</div>
      `);
      return;
    }

    const r = json.registro;

    if (json.status === "VALIDO") {
      mostrar("ok", `
        <strong>Treinamento válido.</strong>
        <div class="linha"><strong>Nome:</strong> ${r.nome || "-"}</div>
        <div class="linha"><strong>CPF:</strong> ${r.cpf || "-"}</div>
        <div class="linha"><strong>Empresa:</strong> ${r.empresa || "-"}</div>
        <div class="linha"><strong>Placa:</strong> ${r.placa || "-"}</div>
        <div class="linha"><strong>Treinamento:</strong> ${formatarData(r.dataTreinamento)}</div>
        <div class="linha"><strong>Válido até:</strong> ${formatarData(r.validadeAte)}</div>
        <div class="linha"><strong>Protocolo:</strong> ${r.protocolo || "-"}</div>
      `);
    } else {
      mostrar("bad", `
        <strong>Treinamento vencido.</strong>
        <div class="linha">O motorista deve realizar uma nova integração.</div>
        <div class="linha"><strong>Nome:</strong> ${r.nome || "-"}</div>
        <div class="linha"><strong>CPF:</strong> ${r.cpf || "-"}</div>
        <div class="linha"><strong>Empresa:</strong> ${r.empresa || "-"}</div>
        <div class="linha"><strong>Placa:</strong> ${r.placa || "-"}</div>
        <div class="linha"><strong>Último treinamento:</strong> ${formatarData(r.dataTreinamento)}</div>
        <div class="linha"><strong>Venceu em:</strong> ${formatarData(r.validadeAte)}</div>
        <div class="linha"><strong>Protocolo:</strong> ${r.protocolo || "-"}</div>
      `);
    }

  } catch (err) {
    console.error(err);
    mostrar("bad", "Erro ao consultar treinamento. Tente novamente.");
  }
});
document
.getElementById("btnRelatorio")
.addEventListener("click", async () => {

  try {

    const inicio =
      document.getElementById("dataInicial").value;

    const fim =
      document.getElementById("dataFinal").value;

    const resp =
      await fetch(API_RELATORIO);

    const texto = await resp.text();

console.log(texto);

const json = JSON.parse(texto);

    let registros =
      json.registros || [];

    if (inicio) {

      registros = registros.filter(r =>
        r.dataTreinamento.substring(0,10)
        >= inicio
      );

    }

    if (fim) {

      registros = registros.filter(r =>
        r.dataTreinamento.substring(0,10)
        <= fim
      );

    }

    dadosRelatorio = registros;

    document.getElementById(
      "totais"
    ).innerHTML = `
      <strong>Total encontrados:</strong>
      ${registros.length}
    `;

    let html = `
      <table style="
        width:100%;
        border-collapse:collapse;
      ">
      <tr>
        <th>Nome</th>
        <th>Empresa</th>
        <th>CPF</th>
        <th>Data</th>
      </tr>
    `;

    registros.forEach(r => {

      html += `
        <tr>
          <td>${r.nome}</td>
          <td>${r.empresa}</td>
          <td>${r.cpf}</td>
          <td>
  ${new Date(r.dataTreinamento)
    .toLocaleDateString("pt-BR")}
</td>
        </tr>
      `;

    });

    html += "</table>";

    document.getElementById(
      "resultadoRelatorio"
    ).innerHTML = html;

  } catch(err) {

  console.error(err);

  document.getElementById(
    "resultadoRelatorio"
  ).innerHTML =
      "<pre>" + err + "</pre>";

}

});
</script>

</body>
</html>
