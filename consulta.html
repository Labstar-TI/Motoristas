<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consulta de Treinamento — Motoristas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      color: #0e1b3d;
      min-height: 100vh;
      padding: 24px;
    }

    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      border: 1px solid rgba(14,27,61,.12);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    p {
      color: #3a4a70;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #3a4a70;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid rgba(14,27,61,.2);
      margin-bottom: 12px;
    }

    button {
      background: #1E50C8;
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:hover {
      background: #2563eb;
    }

    .resultado {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(14,27,61,.14);
      display: none;
    }

    .ok {
      background: rgba(13,107,58,.10);
      color: #0D6B3A;
      border-color: rgba(13,107,58,.25);
    }

    .bad {
      background: rgba(181,43,43,.09);
      color: #B52B2B;
      border-color: rgba(181,43,43,.25);
    }

    .warn {
      background: rgba(184,114,16,.10);
      color: #B87210;
      border-color: rgba(184,114,16,.25);
    }

    .linha {
      margin-top: 8px;
      font-size: 14px;
    }

    .linha strong {
      display: inline-block;
      min-width: 150px;
      color: #0e1b3d;
    }

    .top-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #1E50C8;
      text-decoration: none;
      font-weight: bold;
    }

    .top-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="box">
    <a class="top-link" href="./index.html">← Voltar para treinamento</a>

    <h1>Consulta de Treinamento</h1>
    <p>
      Digite o CPF do motorista para verificar se o treinamento está válido ou vencido.
    </p>

    <label for="cpfConsulta">CPF do motorista</label>
    <input id="cpfConsulta" type="text" placeholder="Somente números" inputmode="numeric" />

    <button id="btnConsultar">Consultar</button>

    <div id="resultado" class="resultado"></div>
  </div>

<script>
const API_CONSULTA = "https://api-motoristas.vercel.app/api/consultar-treinamento";

const cpfInput = document.getElementById("cpfConsulta");
const btnConsultar = document.getElementById("btnConsultar");
const resultado = document.getElementById("resultado");

function somenteNumeros(valor) {
  return String(valor || "").replace(/\D/g, "").slice(0, 11);
}

function formatarData(dataIso) {
  if (!dataIso) return "-";

  const data = new Date(dataIso);

  return data.toLocaleDateString("pt-BR", {
    timeZone: "America/Sao_Paulo"
  });
}

function mostrar(tipo, html) {
  resultado.className = "resultado " + tipo;
  resultado.innerHTML = html;
  resultado.style.display = "block";
}

cpfInput.addEventListener("input", () => {
  cpfInput.value = somenteNumeros(cpfInput.value);
});

btnConsultar.addEventListener("click", async () => {
  const cpf = somenteNumeros(cpfInput.value);

  if (cpf.length !== 11) {
    mostrar("warn", "<strong>CPF inválido.</strong><br>Digite os 11 números do CPF.");
    return;
  }

  mostrar("warn", "Consultando...");

  try {
    const resp = await fetch(API_CONSULTA + "?cpf=" + encodeURIComponent(cpf));
    const json = await resp.json();

    if (!resp.ok || !json.ok) {
      mostrar("bad", `
        <strong>Treinamento não encontrado.</strong>
        <div class="linha">O motorista deve realizar a integração.</div>
      `);
      return;
    }

    const r = json.registro;

    if (json.status === "VALIDO") {
      mostrar("ok", `
        <strong>Treinamento válido.</strong>
        <div class="linha"><strong>Nome:</strong> ${r.nome || "-"}</div>
        <div class="linha"><strong>CPF:</strong> ${r.cpf || "-"}</div>
        <div class="linha"><strong>Empresa:</strong> ${r.empresa || "-"}</div>
        <div class="linha"><strong>Placa:</strong> ${r.placa || "-"}</div>
        <div class="linha"><strong>Treinamento:</strong> ${formatarData(r.dataTreinamento)}</div>
        <div class="linha"><strong>Válido até:</strong> ${formatarData(r.validadeAte)}</div>
        <div class="linha"><strong>Protocolo:</strong> ${r.protocolo || "-"}</div>
      `);
    } else {
      mostrar("bad", `
        <strong>Treinamento vencido.</strong>
        <div class="linha">O motorista deve realizar uma nova integração.</div>
        <div class="linha"><strong>Nome:</strong> ${r.nome || "-"}</div>
        <div class="linha"><strong>CPF:</strong> ${r.cpf || "-"}</div>
        <div class="linha"><strong>Empresa:</strong> ${r.empresa || "-"}</div>
        <div class="linha"><strong>Placa:</strong> ${r.placa || "-"}</div>
        <div class="linha"><strong>Último treinamento:</strong> ${formatarData(r.dataTreinamento)}</div>
        <div class="linha"><strong>Venceu em:</strong> ${formatarData(r.validadeAte)}</div>
        <div class="linha"><strong>Protocolo:</strong> ${r.protocolo || "-"}</div>
      `);
    }

  } catch (err) {
    console.error(err);
    mostrar("bad", "Erro ao consultar treinamento. Tente novamente.");
  }
});
</script>

</body>
</html>
